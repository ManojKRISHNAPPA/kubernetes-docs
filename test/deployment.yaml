apiVersion: apps/v1
kind: Deployment
metadata:
  name: boardshackk-deployment
  labels:
    app: boardshackk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: boardshackk
  template:
    metadata:
      labels:
        app: boardshackk
    spec:
      containers:
      - name: boardshackk
        image: manojkrishnappa/itkannadigaru-chat-bot:0fa7c6edd7d87075ed2db8a5e3560dd25de234c2
        ports:
        - containerPort: 8080
        # Add other configurations as needed, e.g., environment variables, volume mounts

